<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEUDI SACRÉE · Commande kebab</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1f2748;--mut:#5d6785;--acc:#2a406c;--acc2:#e6ecf7;--line:#dde3ef;--red:#b91432;--ok:#1f7a3d;--bad:#b91432}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:26px;margin:8px 0 2px;color:var(--acc)}
h1 em{font-style:normal;color:var(--red)}
.sub{color:var(--mut);margin:0 0 16px}
.deadline{background:var(--acc);color:#fff;border-radius:18px;padding:18px 16px;margin:0 0 16px;text-align:center;border-bottom:5px solid var(--red)}
.deadline b{display:block;font-size:30px;line-height:1.1;font-weight:900}
.deadline span{display:block;margin-top:6px;font-size:16px;font-weight:600;opacity:.95}
.deadline.closed{background:var(--red);border-bottom-color:#7d0d21}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(31,39,72,.06)}
h2{font-size:17px;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--acc)}
.tag{font-size:12px;font-weight:600;background:var(--acc2);color:var(--acc);padding:3px 9px;border-radius:8px}
.tag.cnt{background:#edf0f7;color:var(--mut)}
.tag.cnt.full{background:#e3f4ea;color:var(--ok)}
.desc{color:var(--mut);margin:0 0 12px;font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:999px;padding:10px 12px 10px 18px;background:#fff;cursor:pointer;color:inherit;font:inherit;text-align:left;width:100%}
.item.on{border-color:var(--acc);background:var(--acc2)}
.item .l{display:flex;flex-direction:column}
.item small{color:var(--mut)}
.pr{color:var(--red);font-weight:700;white-space:nowrap}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:20px;cursor:pointer;line-height:1}
.step button.p{border-color:var(--acc);color:var(--acc)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step b{min-width:34px;text-align:center;color:var(--acc);font-size:15px}
.mark{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--acc);font-size:16px}
.item.on .mark{border:0;background:var(--acc);color:#fff}
input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.total{font-size:24px;font-weight:800;color:var(--red)}
.hint{color:var(--mut);font-size:13px}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px;text-decoration:underline}
.msg{padding:10px 12px;border-radius:10px;margin:0 0 12px;font-size:14px}
.msg.ok{background:#e3f4ea;color:var(--ok)}.msg.warn{background:#fff4d6;color:#7a5a00}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌯 JEUDI <em>SACRÉE</em></h1>
  <div class="deadline" id="deadline"></div>
  <p class="sub">Choisis ton plat, on s'adapte ensuite. Ta commande est envoyée à l'organisateur.</p>
  <div id="status"></div>

  <div class="card"><h2>Ton trigramme <span class="tag">requis</span></h2><input type="text" id="name" placeholder="Ex : RRO" maxlength="3" autocomplete="off" autocapitalize="characters" style="margin-top:10px;text-transform:uppercase;letter-spacing:.2em;font-weight:700"></div>

  <div class="card"><h2>1. Ton plat <span class="tag">requis</span></h2><div class="list" id="dishes" style="margin-top:10px"></div></div>

  <div class="card hide" id="cMeat">
    <h2>Viande <span class="tag">requis</span> <span class="tag cnt" id="meatCnt"></span></h2>
    <p class="desc" id="meatDesc"></p>
    <div class="list" id="meats"></div>
  </div>

  <div class="card hide" id="cSauce">
    <h2>Sauces <span class="tag">optionnel</span> <span class="tag cnt" id="sauceCnt"></span></h2>
    <p class="desc">2 sauces maximum.</p>
    <div class="list" id="sauces"></div>
  </div>

  <div class="card hide" id="cFries">
    <h2>Frites ?</h2>
    <div class="list" id="fries" style="margin-top:10px"></div>
  </div>

  <div class="card hide" id="cDrink">
    <h2>Boisson ?</h2>
    <div class="list" id="drinks" style="margin-top:10px"></div>
  </div>

  <div class="card hide" id="cPay">
    <h2>Moyen de paiement <span class="tag">requis</span></h2>
    <p class="desc" id="payInfo"></p>
    <div class="list" id="pays"></div>
  </div>

  <div class="card hide" id="cNote"><h2>Remarque <span class="tag">optionnel</span></h2><input type="text" id="note" placeholder="Sans oignons, bien cuit…" maxlength="80" style="margin-top:10px"></div>

  <div class="card">
    <div class="row"><span>Ton total</span><span class="total" id="price">–</span></div>
    <p class="hint" id="summary" style="margin:6px 0 12px"></p>
    <button class="btn" id="submit" disabled>Ajouter ma commande</button>
  </div>

  <div class="card hide" id="mineCard"><h2>Ta commande enregistrée ✔</h2><p id="mineTxt" class="desc"></p><button class="x" id="mineDel">Annuler ma commande</button></div>

</div>

<script src="menu.js?v=20261113b"></script>
<script>
const st = {dish:null, meats:{}, sauces:[], fries:null, drink:null, payment:null}; // fries: true/false, drink: ''(none) | name

function row(html, on, onClick, cls){
  const b = document.createElement('button'); b.type='button';
  b.className='item'+(on?' on':'')+(cls?' '+cls:''); b.innerHTML = html; b.onclick = onClick; return b;
}

function render(){
  const d = dishOf(st.dish), max = d?d.meats:0;
  ['cMeat','cSauce','cFries','cDrink','cPay','cNote'].forEach(id=>$(id).classList.toggle('hide',!d));
  if(d&&d.fixedFries) $('cFries').classList.add('hide');

  // plats
  $('dishes').innerHTML='';
  MENU.dishes.forEach(x=>{
    $('dishes').appendChild(row('<span class="l"><b>'+esc(x.name)+'</b><small>'+esc(x.desc)+'</small></span><span class="pr">'+eur(x.price)+'</span>',
      st.dish===x.id, ()=>{ st.dish=x.id; trimMeats(); render(); }));
  });

  if(d){
    // viandes
    const n = sum(st.meats);
    $('meatCnt').textContent = n+'/'+max+' choisie'+(max>1?'s':'');
    $('meatCnt').classList.toggle('full', n===max);
    $('meatDesc').textContent = max===1 ? '1 viande au choix.' : 'Choisis '+max+' viandes. Tu peux prendre la même plusieurs fois (x2, x3…).';
    $('meats').innerHTML='';
    MENU.meats.forEach(m=>{
      const c = st.meats[m]||0;
      const el = document.createElement('div'); el.className='item'+(c?' on':''); el.style.cursor='default';
      el.innerHTML = '<span>'+esc(m)+'</span><span class="step"><button type="button" class="mn" '+(c?'':'disabled')+'>−</button><b>'+(c?'x'+c:'')+'</b><button type="button" class="p pl">+</button></span>';
      el.querySelector('.mn').onclick = ()=>{ st.meats[m]=Math.max(0,c-1); if(!st.meats[m]) delete st.meats[m]; render(); };
      el.querySelector('.pl').onclick = ()=>{
        if(sum(st.meats)>=max){ if(max===1){ st.meats={}; st.meats[m]=1; render(); } return; }
        st.meats[m]=c+1; render();
      };
      if(sum(st.meats)>=max && max>1) el.querySelector('.pl').disabled = true;
      $('meats').appendChild(el);
    });

    // sauces
    $('sauceCnt').textContent = st.sauces.length+'/'+MENU.maxSauces+' choisie'+(MENU.maxSauces>1?'s':'');
    $('sauces').innerHTML='';
    MENU.sauces.forEach(s=>{
      const on = st.sauces.includes(s);
      $('sauces').appendChild(row('<span>'+esc(s)+'</span><span class="mark">'+(on?'✓':'+')+'</span>', on, ()=>{
        if(on) st.sauces = st.sauces.filter(x=>x!==s);
        else if(st.sauces.length<MENU.maxSauces) st.sauces.push(s);
        render();
      }));
    });

    // frites
    $('fries').innerHTML='';
    $('fries').appendChild(row('<span>Sans frites</span>', st.fries===false, ()=>{st.fries=false;render();}));
    $('fries').appendChild(row('<span>Avec frites</span><span class="pr">+'+eur(d.fries)+'</span>', st.fries===true, ()=>{st.fries=true;render();}));

    // boisson
    $('drinks').innerHTML='';
    $('drinks').appendChild(row('<span>Sans boisson</span>', st.drink==='', ()=>{st.drink='';render();}));
    MENU.drinks.forEach(x=>{
      $('drinks').appendChild(row('<span>'+esc(x)+'</span><span class="pr">+'+eur(d.drink)+'</span>', st.drink===x, ()=>{st.drink=x;render();}));
    });
  }

    $('payInfo').textContent = '💶 ' + MENU.payInfo;
    $('pays').innerHTML='';
    MENU.payments.forEach(x=>{
      $('pays').appendChild(row('<span>'+esc(x)+'</span><span class="mark">'+(st.payment===x?'✓':'+')+'</span>', st.payment===x, ()=>{st.payment=x;render();}));
    });

  const ok = !isClosed() && /^[A-Z]{3}$/.test($('name').value.trim().toUpperCase()) && d && sum(st.meats)===max && (st.fries!==null||d.fixedFries) && st.drink!==null && st.payment!==null;
  $('submit').disabled = !ok;
  if(d){
    const o = cur();
    $('price').textContent = eur(orderPrice(o));
    if(ok) $('summary').textContent = describe(o);
    else {
      const missing = [];
      if(!/^[A-Z]{3}$/.test($('name').value.trim().toUpperCase())) missing.push('ton trigramme (3 lettres)');
      if(sum(st.meats)!==max) missing.push((max-sum(st.meats)>0?'encore '+(max-sum(st.meats)):'trop de')+' viande'+(max>1?'s':''));
      if(st.fries===null&&!d.fixedFries) missing.push('frites oui/non');
      if(st.drink===null) missing.push('boisson oui/non');
      if(st.payment===null) missing.push('moyen de paiement');
      $('summary').textContent = isClosed() ? 'Commandes closes : il est trop tard.' : 'À compléter : '+missing.join(', ');
    }
  } else { $('price').textContent='–'; $('summary').textContent='Choisis un plat pour commencer.'; }
}
function trimMeats(){
  const max = dishOf(st.dish).meats;
  while(sum(st.meats)>max){
    const k = Object.keys(st.meats).pop();
    st.meats[k]--; if(!st.meats[k]) delete st.meats[k];
  }
}
function cur(){
  return {name:$('name').value.trim().toUpperCase(), dish:st.dish, meats:Object.assign({},st.meats), sauces:st.sauces.slice(), fries:st.fries===true||!!(dishOf(st.dish)&&dishOf(st.dish).fixedFries), drink:st.drink||'', payment:st.payment||'', note:$('note').value.trim()};
}

let clientId = null, myOrder = null;
try{ clientId = localStorage.getItem('clientId'); myOrder = JSON.parse(localStorage.getItem('myOrder')||'null'); }catch(e){}
if(!clientId){
  clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(36).slice(2)+'xxxxxxxx');
  try{ localStorage.setItem('clientId', clientId); }catch(e){}
}
function renderMine(){
  $('mineCard').classList.toggle('hide',!myOrder);
  if(myOrder) $('mineTxt').textContent = describe(myOrder)+' — '+eur(orderPrice(myOrder))+' · Paiement : '+(myOrder.payment||'?')+' ('+MENU.payInfo+'). Si tu valides à nouveau, ça remplace cette commande.';
}
async function submit(){
  if(isClosed()) return;
  const o = cur();
  $('submit').disabled = true;
  try{
    await rpc('submit_order',{p_client_id:clientId,p_name:o.name,p_dish:o.dish,p_meats:o.meats,p_sauces:o.sauces,p_fries:o.fries,p_drink:o.drink,p_note:o.note,p_payment:o.payment});
    o.round=round; myOrder=o; try{localStorage.setItem('myOrder',JSON.stringify(o));}catch(e){}
    $('status').innerHTML='<div class="msg ok">Commande envoyée pour '+esc(o.name)+' ✔</div>';
    st.dish=null; st.meats={}; st.sauces=[]; st.fries=null; st.drink=null; st.payment=null; $('note').value='';
    render(); renderMine(); window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    $('status').innerHTML='<div class="msg warn">Envoi impossible. Donne ta commande à l\'organisateur : <b>'+esc(o.name+' : '+describe(o))+'</b></div>';
    render(); refreshStatus();
  }
}
async function cancelMine(){
  if(!await confirmBox('Êtes-vous sûr ?','Annuler ta commande ?','Annuler ma commande',{cancelLabel:'Non, garder'})) return;
  try{ await rpc('cancel_order',{p_client_id:clientId}); myOrder=null; try{localStorage.removeItem('myOrder');}catch(e){} renderMine(); }
  catch(e){ $('status').innerHTML='<div class="msg warn">Annulation impossible, réessaie.</div>'; }
}

$('name').oninput=()=>{ $('name').value=$('name').value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3); render(); }; $('note').oninput=render;
let ordersOpen = true, round = 1;
function isClosed(){ return !ordersOpen; }
async function refreshStatus(){
  try{ const v = await rpc('get_status',{}); if(typeof v==='boolean') ordersOpen = v; }catch(e){}
  try{
    const r = await rpc('get_round',{});
    if(typeof r==='number'){
      round = r;
      if(myOrder && (myOrder.round||1)!==round){ myOrder=null; try{localStorage.removeItem('myOrder');}catch(e){} renderMine(); }
    }
  }catch(e){}
  renderDeadline(); render();
}
function renderDeadline(){
  const c = isClosed(), h = MENU.cutoffHour || 11;
  $('deadline').className = 'deadline'+(c?' closed':'');
  $('deadline').innerHTML = c
    ? '<b>⛔ Commandes closes</b><span>La commande est passée : trop tard !</span>'
    : '<b>⏰ Commandes jusqu\'à '+h+'h</b><span>Au-delà de '+h+'h, la commande est passée : trop tard !</span>';
}
renderDeadline(); refreshStatus(); setInterval(refreshStatus, 20000);
$('submit').onclick=submit;
$('mineDel').onclick=cancelMine;
render();

renderMine();
</script>
</body>
</html>
