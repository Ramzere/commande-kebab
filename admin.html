<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Organisateur · JEUDI SACRÉE</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1f2748;--mut:#5d6785;--acc:#2a406c;--acc2:#e6ecf7;--line:#dde3ef;--red:#b91432;--ok:#1f7a3d;--bad:#b91432}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:24px;margin:8px 0 14px;color:var(--acc)}
h2,h3{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(31,39,72,.06)}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc);font-weight:600;padding:8px 14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pr{color:var(--red);font-weight:700;white-space:nowrap}
.hint{color:var(--mut);font-size:13px}
.order{border-top:1px solid var(--line);padding:10px 0}.order:first-child{border-top:0}
.who{font-weight:700;letter-spacing:.08em}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px;text-decoration:underline}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-top:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700;color:var(--red);white-space:nowrap}tr:first-child td{border-top:0}
.err{color:var(--bad);margin-top:8px}.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>👀 Organisateur · JEUDI SACRÉE</h1>

  <div class="card" id="login">
    <input type="password" id="pass" placeholder="Mot de passe organisateur" autocomplete="current-password">
    <div style="margin-top:10px"><button class="btn" id="go">Voir les commandes</button></div>
    <div class="err hide" id="err"></div>
  </div>

  <div id="main" class="hide">
    <div class="card" id="statusCard">
      <div class="row"><div><div id="statusTxt" style="font-size:20px;font-weight:800"></div><div class="hint">Les invités voient le changement en quelques secondes.</div></div>
        <button class="btn" id="toggle">…</button></div>
    </div>
    <div class="card">
      <div class="row"><h2 style="margin:0;font-size:18px">Récap · <span id="count">0</span> commande(s)</h2>
        <span><button class="btn sec" id="refresh">Actualiser</button> <button class="btn sec" id="copy">Copier</button></span></div>
      <div id="recap" style="margin-top:12px"></div>
      <p class="hint hide" id="copied">Copié ✔</p>
    </div>
    <div class="card"><div id="orders"></div></div>
  </div>
</div>

<script src="menu.js?v=20261113"></script>
<script>
let pass = '', orders = [], open = true;
function renderStatus(){
  $('statusTxt').textContent = open ? '🟢 Commandes ouvertes' : '🔴 Commandes fermées';
  $('toggle').textContent = open ? 'Fermer les commandes' : 'Ouvrir les commandes';
  $('toggle').style.background = open ? 'var(--red)' : '';
  $('toggle').style.color = open ? '#fff' : '';
}
async function loadStatus(){ try{ const v = await rpc('get_status',{}); if(typeof v==='boolean') open=v; }catch(e){} renderStatus(); }


function rec(){
  const g = {}; let total = 0;
  orders.forEach(o=>{ const k=describe(Object.assign({},o,{note:''})); g[k]=(g[k]||0)+1; total+=orderPrice(o); });
  return {g,total};
}
function render(){
  $('count').textContent = orders.length;
  const {g,total} = rec();
  $('recap').innerHTML = orders.length
    ? '<table>'+Object.entries(g).map(([k,n])=>'<tr><td>'+n+' × '+esc(k)+'</td><td></td></tr>').join('')+'<tr><td><b>Total</b></td><td>'+eur(total)+'</td></tr></table>'
    : '<p class="hint">Aucune commande pour l\'instant.</p>';
  if(orders.length){
    const pay = {}; orders.forEach(o=>{ const k=o.payment||'Non précisé'; pay[k]=pay[k]||{n:0,t:0}; pay[k].n++; pay[k].t+=orderPrice(o); });
    $('recap').innerHTML += '<h3 style="margin:14px 0 4px;font-size:15px;color:var(--mut)">Par moyen de paiement</h3><table>'
      +Object.entries(pay).map(([k,v])=>'<tr><td>'+esc(k)+' · '+v.n+' commande(s)</td><td>'+eur(v.t)+'</td></tr>').join('')+'</table>';
  }
  $('orders').innerHTML = orders.map(o=>'<div class="order"><div class="row"><span class="who">'+esc(o.name)+'</span><span class="pr">'+eur(orderPrice(o))
    +' <button class="x" data-del="'+esc(o.id)+'">supprimer</button></span></div><div class="hint">'+esc(describe(o))+'</div><div class="hint">💶 '+esc(o.payment||'paiement non précisé')+'</div></div>').join('');
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Supprimer cette commande ?')) return;
    try{ await rpc('admin_delete',{p_pass:pass,p_id:b.dataset.del}); load(); }catch(e){}
  });
}
async function load(){
  try{ orders = await rpc('admin_list',{p_pass:pass}) || []; render(); return true; }
  catch(e){ return false; }
}
$('go').onclick = async ()=>{
  pass = $('pass').value;
  $('err').classList.add('hide');
  if(await load()){ $('login').classList.add('hide'); $('main').classList.remove('hide'); loadStatus(); }
  else { $('err').textContent='Mot de passe incorrect.'; $('err').classList.remove('hide'); }
};
$('pass').onkeydown = e=>{ if(e.key==='Enter') $('go').click(); };
$('refresh').onclick = ()=>{ load(); loadStatus(); };
$('toggle').onclick = async ()=>{
  const next = !open;
  if(!next || confirm('Fermer les commandes ? Plus personne ne pourra commander.')){
    try{ await rpc('admin_set_open',{p_pass:pass,p_open:next}); open=next; renderStatus(); }catch(e){ alert('Échec, réessaie.'); }
  }
};
$('copy').onclick = async ()=>{
  const {g,total} = rec();
  const txt = 'Commande ('+orders.length+')\n'+Object.entries(g).map(([k,n])=>n+' x '+k).join('\n')
    +'\n\nDétail :\n'+orders.map(o=>'- '+o.name+' : '+describe(o)+' ['+eur(orderPrice(o))+', '+(o.payment||'?')+']').join('\n')+'\nTotal : '+eur(total);
  try{ await navigator.clipboard.writeText(txt); $('copied').classList.remove('hide'); setTimeout(()=>$('copied').classList.add('hide'),1800); }catch(e){}
};
</script>
</body>
</html>
